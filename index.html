<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/fnd-180.png">

<meta name="theme-color" content="#0A0E16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FND Leave">


<title>Personal Leave Record</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0A0E16;
  --surface:#121826;
  --card:#161D2C;
  --card-2:#1E2637;
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.14);

  --text:#F1F3F8;
  --text-dim:#C7CCDA;
  --muted:#8890A3;
  --muted-2:#5C6377;

  --accent:#6C8CFF;
  --accent-soft:rgba(108,140,255,.16);

  --red:#F87171;
  --red-bg:rgba(248,113,113,.14);
  --green:#34D399;
  --green-bg:rgba(52,211,153,.14);

  --radius-xl:24px;
  --radius-lg:18px;
  --radius:14px;
  --radius-sm:10px;

  --shadow-sm:
    0 2px 6px rgba(0,0,0,.25);

  --shadow-md:
    0 10px 26px rgba(0,0,0,.35);

  --shadow-lg:
    0 24px 60px rgba(0,0,0,.55);
}

:root[data-theme="light"]{
  --bg:#F3F5F9;
  --surface:#FFFFFF;
  --card:#FFFFFF;
  --card-2:#F6F7FB;
  --border:rgba(15,23,42,.09);
  --border-strong:rgba(15,23,42,.18);

  --text:#151B2B;
  --text-dim:#3C4557;
  --muted:#6B7386;
  --muted-2:#9AA1B2;

  --accent:#4A5FE0;
  --accent-soft:rgba(74,95,224,.12);

  --red:#DC2626;
  --red-bg:rgba(220,38,38,.09);
  --green:#16A34A;
  --green-bg:rgba(22,163,74,.09);

  --shadow-sm:
    0 1px 3px rgba(15,23,42,.06);

  --shadow-md:
    0 8px 20px rgba(15,23,42,.08);

  --shadow-lg:
    0 20px 46px rgba(15,23,42,.16);
}

:root[data-theme="light"] .pl-field select,
:root[data-theme="light"] .pl-field input,
:root[data-theme="light"] .pl-setting-inputs input,
:root[data-theme="light"] .pl-setting-inputs select{
  color-scheme:light;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html{
  overflow-x:hidden;
  background:var(--bg);
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button,
input,
select{
  font-family:'Inter',sans-serif;
}

::selection{
  background:var(--accent-soft);
  color:#fff;
}

@media (prefers-reduced-motion:reduce){
  *{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}

/* =========================================================
   PAGE — single-column, tuned for Samsung S25 Ultra
========================================================= */

.page{
  width:100%;
  max-width:480px;
  margin:0 auto;
  padding:
    max(14px, env(safe-area-inset-top))
    14px
    calc(96px + env(safe-area-inset-bottom));
}

/* =========================================================
   HEADER
========================================================= */

.header{
  position:sticky;
  top:0;
  z-index:50;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;

  margin:
    calc(-1 * max(14px, env(safe-area-inset-top)))
    -14px
    16px;
  padding:
    calc(max(14px, env(safe-area-inset-top)) + 8px)
    14px
    12px;

  background:rgba(10,14,22,.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}

.header-left{
  min-width:0;
}

.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  font-weight:500;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:3px;
}

.title{
  font-size:15.5px;
  font-weight:800;
  color:var(--text);
  letter-spacing:-.2px;
  line-height:1.2;
}

.subtitle{
  display:none;
}

.pl-settings-btn{
  -webkit-appearance:none;
  appearance:none;

  width:38px;
  height:38px;
  flex-shrink:0;

  border:1px solid var(--border);
  border-radius:11px;

  background:var(--card-2);
  color:var(--text-dim);

  font-size:16px;
  cursor:pointer;

  transition:.15s ease;
}

.pl-settings-btn:active{
  transform:scale(.92);
  background:var(--border);
}

/* =========================================================
   HEADER / LIVE DATE & TIME
========================================================= */

.pl-header-main{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.pl-header-icon{
  width:36px;
  height:36px;
  flex:0 0 36px;
  border-radius:10px;
  object-fit:cover;
  display:block;
  border:1px solid var(--border-strong);
}

.pl-header-title-wrap{
  min-width:0;
}

.pl-header-right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  flex-shrink:0;
}

.pl-datetime{
  text-align:right;
  line-height:1.15;
  padding-right:2px;
}

.pl-date{
  color:var(--muted);
  font-size:8.5px;
  font-weight:700;
  letter-spacing:.03em;
  white-space:nowrap;
}

.pl-time{
  margin-top:3px;
  color:var(--text-dim);
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  font-weight:500;
  letter-spacing:-.1px;
  white-space:nowrap;
}

/* =========================================================
   MAIN SHEET
========================================================= */

.leave-container{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-xl);
  padding:16px 14px;
  box-shadow:var(--shadow-sm);
}

/* =========================================================
   STATUS
========================================================= */

.status{
  margin-bottom:14px;
  padding:10px 13px;
  border-radius:12px;
  font-size:12px;
  font-weight:600;
  display:none;
}

.status.show{
  display:block;
  animation:plToast .25s ease;
}

.status.error{
  background:var(--red-bg);
  color:var(--red);
}

.status.success{
  background:var(--green-bg);
  color:var(--green);
}

@keyframes plToast{
  from{ opacity:0; transform:translateY(-4px); }
  to{ opacity:1; transform:translateY(0); }
}

/* =========================================================
   LEAVE CARDS
========================================================= */

.pl-leave-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:18px;
}

.pl-card{
  -webkit-appearance:none;
  appearance:none;

  position:relative;

  min-height:130px;

  border:1px solid var(--border);
  border-radius:var(--radius);

  background:var(--card-2);

  padding:14px;

  text-align:left;
  cursor:pointer;

  overflow:hidden;

  transition:transform .15s ease, border-color .15s ease;

  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

.pl-card:active{
  transform:scale(.97);
  border-color:var(--border-strong);
}

.pl-icon{
  width:32px;
  height:32px;

  border-radius:9px;

  background:var(--pl-icon-bg);
  color:var(--pl-accent);

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:14px;
}

.pl-icon svg{
  width:16px;
  height:16px;

  fill:none;
  stroke:currentColor;

  stroke-width:2;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.pl-balance{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:20px;

  letter-spacing:-.4px;

  color:var(--pl-accent);

  line-height:1.15;

  word-break:break-word;
}

.pl-balance.negative{
  color:var(--red) !important;
}

.pl-available{
  font-size:8.5px;

  color:var(--muted);

  font-weight:800;

  letter-spacing:.1em;

  margin-top:6px;
}

.pl-arrow{
  position:absolute;

  right:13px;
  bottom:12px;

  color:var(--muted-2);

  font-size:13px;
}

/* =========================================================
   ADD FORM
========================================================= */

.pl-add-section{
  padding-top:14px;
  border-top:1px solid var(--border);
}

.pl-add-toggle{
  display:none;
}

.pl-form{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;

  align-items:end;

  animation:plFormIn .22s ease;
}

@keyframes plFormIn{
  from{ opacity:0; transform:translateY(-4px); }
  to{ opacity:1; transform:translateY(0); }
}

.pl-field{
  display:flex;
  flex-direction:column;

  gap:5px;

  min-width:0;
}

.pl-field-narrow{
  max-width:none;
}

.pl-field-wide{
  grid-column:1 / -1;
}

.pl-field label{
  font-size:9.5px;

  font-weight:800;

  color:var(--muted);

  text-transform:uppercase;

  letter-spacing:.05em;
}

.pl-field select,
.pl-field input{
  width:100%;

  padding:11px 10px;

  border:1px solid var(--border);

  border-radius:11px;

  background:var(--card);
  color:var(--text);

  font-size:14px;

  box-sizing:border-box;

  outline:none;

  transition:.15s ease;

  color-scheme:dark;
}

.pl-field select:focus,
.pl-field input:focus{
  border-color:var(--accent);

  box-shadow:
    0 0 0 3px var(--accent-soft);
}

.pl-add-btn{
  border:0;

  border-radius:12px;

  padding:12px 14px;

  background:var(--accent);

  color:#fff;

  font-weight:700;

  cursor:pointer;

  font-size:13px;

  white-space:nowrap;

  grid-column:1 / -1;

  transition:.15s ease;
}

.pl-add-btn:active{
  transform:scale(.98);
  filter:brightness(.92);
}

.pl-add-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* =========================================================
   RECORDS
========================================================= */

.pl-records{
  margin-top:16px;

  scroll-margin-top:74px;

  background:var(--card-2);

  border:1px solid var(--border);

  border-radius:var(--radius-lg);

  padding:14px;
}

.pl-records-head{
  display:flex;

  justify-content:space-between;
  align-items:center;

  margin-bottom:2px;
}

.pl-records-head strong{
  font-size:12px;
  font-weight:800;
  letter-spacing:.03em;
  text-transform:uppercase;
  color:var(--text-dim);
}

.pl-line{
  display:flex;

  justify-content:space-between;
  align-items:center;

  border-top:1px solid var(--border);

  padding:12px 0;

  margin-top:12px;

  font-size:12px;

  gap:10px;
}

.pl-line:first-child{
  border-top:none;

  margin-top:0;

  padding-top:0;
}

.pl-line-left{
  min-width:0;
}

.pl-line-left b{
  font-size:13px;
  font-weight:700;

  color:var(--text);
}

.pl-line-muted{
  color:var(--muted);

  font-size:10.5px;

  margin-top:3px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.pl-line-right{
  display:flex;

  align-items:center;

  gap:8px;

  flex-shrink:0;
}

.pl-line-right b{
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  font-weight:600;
  color:var(--text);

  background:var(--card);
  border:1px solid var(--border);
  border-radius:8px;
  padding:4px 8px;
  white-space:nowrap;
}

.pl-delete{
  -webkit-appearance:none;
  appearance:none;

  background:none;

  border:none;

  outline:none;

  box-shadow:none;

  color:var(--muted-2);

  position:relative;

  cursor:pointer;

  padding:0;
  margin:0;

  width:24px;
  height:24px;

  min-width:0;
  max-width:24px;

  border-radius:7px;

  flex:0 0 24px;

  box-sizing:border-box;

  transition:.15s ease;
}

.pl-delete::before,
.pl-delete::after{
  content:'';

  position:absolute;

  top:50%;
  left:50%;

  width:11px;
  height:1.6px;

  border-radius:2px;

  background:currentColor;
}

.pl-delete::before{
  transform:
    translate(-50%,-50%)
    rotate(45deg);
}

.pl-delete::after{
  transform:
    translate(-50%,-50%)
    rotate(-45deg);
}

.pl-delete:active{
  background:var(--red-bg);
  color:var(--red);
  transform:scale(.9);
}

/* =========================================================
   MODALS — bottom-sheet, one-handed friendly
========================================================= */

.pl-overlay{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.6);

  backdrop-filter:blur(3px);

  display:flex;

  align-items:flex-end;
  justify-content:center;

  padding:0;

  z-index:200;

  animation:plOverlayIn .2s ease;
}

@keyframes plOverlayIn{
  from{ opacity:0; }
  to{ opacity:1; }
}

.pl-modal{
  width:100%;
  max-width:480px;

  max-height:86vh;

  overflow-y:auto;

  background:var(--surface);
  border:1px solid var(--border);
  border-bottom:0;

  color:var(--text);

  border-radius:24px 24px 0 0;

  padding:14px 18px
    max(18px, env(safe-area-inset-bottom))
    18px;

  position:relative;

  box-shadow:var(--shadow-lg);

  animation:plSheetIn .28s cubic-bezier(.2,.8,.2,1);
}

@keyframes plSheetIn{
  from{ transform:translateY(100%); }
  to{ transform:translateY(0); }
}

.pl-modal::before{
  content:'';
  display:block;
  width:38px;
  height:4px;
  border-radius:3px;
  background:var(--border-strong);
  margin:2px auto 14px;
}

.pl-settings-modal{
  width:100%;
}

.pl-close{
  -webkit-appearance:none;
  appearance:none;

  position:absolute;

  right:14px;
  top:16px;

  width:30px;
  height:30px;

  border:1px solid var(--border);

  border-radius:9px;

  background:var(--card-2);

  cursor:pointer;
}

.pl-close::before,
.pl-close::after{
  content:'';

  position:absolute;

  top:50%;
  left:50%;

  width:12px;
  height:2px;

  border-radius:2px;

  background:var(--text-dim);
}

.pl-close::before{
  transform:
    translate(-50%,-50%)
    rotate(45deg);
}

.pl-close::after{
  transform:
    translate(-50%,-50%)
    rotate(-45deg);
}

.pl-close:active{
  background:var(--border);
}

.pl-modal-head{
  display:flex;

  gap:12px;

  align-items:center;

  padding-right:34px;
}

.pl-modal-icon{
  width:44px;
  height:44px;

  border-radius:13px;

  flex-shrink:0;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:19px;

  background:
    var(--pl-icon-bg,var(--card-2));

  color:
    var(--pl-accent,var(--text));
}

.pl-modal-icon svg{
  width:21px;
  height:21px;

  fill:none;

  stroke:currentColor;

  stroke-width:2;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.pl-modal-title{
  font-size:17px;

  font-weight:800;

  color:var(--text);
  letter-spacing:-.2px;
}

.pl-modal-sub{
  font-size:11px;

  color:var(--muted);

  margin-top:2px;
}

.pl-available-box{
  margin-top:16px;

  padding:16px;

  border-radius:16px;

  background:var(--card);
  border:1px solid var(--border);
}

.pl-available-box span{
  display:block;

  font-size:9px;

  color:var(--muted);

  font-weight:800;

  letter-spacing:.1em;
}

.pl-available-box strong{
  font-family:'IBM Plex Mono',monospace;
  font-size:27px;
  font-weight:600;

  display:block;

  margin-top:5px;

  color:var(--text);
}

.pl-detail-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;

  margin-top:12px;
}

.pl-detail{
  border:1px solid var(--border);

  border-radius:12px;

  padding:11px 12px;

  background:var(--card);
}

.pl-detail span{
  display:block;

  font-size:8.5px;

  color:var(--muted);

  text-transform:uppercase;

  font-weight:800;

  letter-spacing:.05em;
}

.pl-detail strong{
  display:block;

  margin-top:5px;

  font-family:'IBM Plex Mono',monospace;
  font-size:14px;

  color:var(--text);
}

.pl-note{
  margin-top:12px;

  padding:11px 13px;

  border-radius:11px;

  background:var(--accent-soft);

  color:var(--text-dim);

  border:1px solid rgba(108,140,255,.28);

  font-size:11px;

  line-height:1.5;
}

/* =========================================================
   SETTINGS
========================================================= */

.pl-settings-section-title{
  margin-top:18px;

  margin-bottom:8px;

  font-size:10.5px;

  color:var(--muted);

  font-weight:800;

  text-transform:uppercase;

  letter-spacing:.08em;
}

.pl-settings-list{
  display:flex;

  flex-direction:column;

  gap:9px;
}

.pl-setting-row{
  display:grid;

  grid-template-columns:1fr auto;

  gap:10px;

  align-items:center;

  padding:12px;

  border:1px solid var(--border);

  border-radius:13px;

  background:var(--card);
}

.pl-setting-name{
  font-weight:700;

  font-size:12.5px;

  color:var(--text);
}

.pl-setting-desc{
  font-size:9.5px;

  color:var(--muted);

  margin-top:3px;
}

.pl-setting-inputs{
  display:flex;

  align-items:center;

  gap:6px;

  flex-wrap:wrap;

  justify-content:flex-end;
}

.pl-setting-inputs input{
  width:60px;

  padding:8px;

  border:1px solid var(--border);

  border-radius:8px;

  background:var(--surface);
  color:var(--text);

  font-size:13px;

  font-family:'IBM Plex Mono',monospace;

  color-scheme:dark;
}

.pl-setting-inputs select{
  width:84px;

  padding:8px;

  border:1px solid var(--border);

  border-radius:8px;

  font-size:12px;

  background:var(--surface);
  color:var(--text);

  color-scheme:dark;
}

.pl-setting-inputs span{
  font-size:10.5px;

  color:var(--muted);
}

/* =========================================================
   SEGMENTED CONTROL — language / theme
========================================================= */

.pl-seg{
  display:flex;
  gap:3px;

  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;

  padding:3px;
}

.pl-seg-btn{
  -webkit-appearance:none;
  appearance:none;

  border:0;
  border-radius:7px;

  padding:7px 13px;

  background:transparent;
  color:var(--muted);

  font-size:11.5px;
  font-weight:700;

  cursor:pointer;

  transition:.15s ease;
}

.pl-seg-btn.active{
  background:var(--accent);
  color:#fff;
}

.pl-seg-btn:active{
  transform:scale(.95);
}

.pl-settings-actions{
  display:flex;

  justify-content:flex-end;

  gap:8px;

  margin-top:18px;
}

.pl-settings-cancel{
  -webkit-appearance:none;

  border:1px solid var(--border);

  background:var(--card-2);

  color:var(--text);

  border-radius:11px;

  padding:11px 15px;

  cursor:pointer;

  font-size:13px;
  font-weight:600;
}

.pl-settings-cancel:active{
  transform:scale(.97);
}

.pl-settings-save{
  -webkit-appearance:none;

  border:0;

  background:var(--accent);

  color:#fff;

  border-radius:11px;

  padding:11px 17px;

  cursor:pointer;

  font-weight:700;

  font-size:13px;
}

.pl-settings-save:active{
  transform:scale(.97);
  filter:brightness(.92);
}

/* =========================================================
   LOADING / EMPTY
========================================================= */

.loading{
  grid-column:1/-1;
  padding:38px 15px;

  text-align:center;

  color:var(--muted);

  font-size:12.5px;
}

.empty{
  color:var(--muted);

  font-size:13px;

  font-style:italic;
}

/* =========================================================
   BOTTOM NAVIGATION
========================================================= */

.pl-bottomnav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:90;

  display:flex;
  align-items:center;
  justify-content:space-around;

  max-width:480px;
  margin:0 auto;

  background:rgba(18,24,38,.92);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--border);

  padding:
    9px 10px

function t(key){

  return (
    (PL_I18N[PL_LANG] && PL_I18N[PL_LANG][key]) ||
    PL_I18N.en[key] ||
    key
  );

}


const PL_TYPE_KEYS = {

  'Annual Leave':'type_annual',
  'Medical Leave':'type_medical',
  'Hospitalization':'type_hosp',
  'Compassionate Leave':'type_compassionate'

};


function plTypeLabel(type){

  const key = PL_TYPE_KEYS[type];

  return key
    ? t(key)
    : escapeHtml(type);

}


/* =========================================================
   STATE
========================================================= */

let STATE = {

  leaveRecords: [],

  leaveSettings: null

};


/* =========================================================
   CONSTANTS
========================================================= */

const PL_WORK_HOURS = 8;


const PL_TYPES = [

  'Annual Leave',

  'Medical Leave',

  'Hospitalization',

  'Compassionate Leave'

];


const PL_ICONS = {

  'Annual Leave':

    '<rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/>' +

    '</svg>',

  'Medical Leave':

    '<path d="M9 3h6v5h5v6h-5v5H9v-5H4V8h5z"/>' +
    '</svg>',

  'Hospitalization':
    '<svg viewBox="0 0 24 24">' +
    '<path d="M5 20V5.5A1.5 1.5 0 0 1 6.5 4h11A1.5 1.5 0 0 1 19 5.5V20M3 20h18M9 20v-4h6v4M10 8h4M12 6v4"/>' +
    '</svg>',

  'Compassionate Leave':
    '<svg viewBox="0 0 24 24">' +
    '<path d="M20.8 8.8c0 5.2-8.8 10.2-8.8 10.2S3.2 14 3.2 8.8A4.8 4.8 0 0 1 12 6.1a4.8 4.8 0 0 1 8.8 2.7z"/>' +
    '</svg>'

};


const PL_ACCENTS_DARK = {

  'Annual Leave':
    ['#818CF8','rgba(129,140,248,.16)'],

  'Medical Leave':
    ['#34D399','rgba(52,211,153,.16)'],

  'Hospitalization':
    ['#FB7185','rgba(251,113,133,.16)'],

  'Compassionate Leave':
    ['#C4B5FD','rgba(196,181,253,.16)']

};

const PL_ACCENTS_LIGHT = {

  'Annual Leave':
    ['#4338CA','rgba(67,56,202,.10)'],

  'Medical Leave':
    ['#047857','rgba(4,120,87,.10)'],

  'Hospitalization':
    ['#BE123C','rgba(190,18,60,.10)'],

  'Compassionate Leave':
    ['#6D28D9','rgba(109,40,217,.10)']

};

function getPlAccents(){

  return PL_THEME === 'light'
    ? PL_ACCENTS_LIGHT
    : PL_ACCENTS_DARK;

}


const PL_DEFAULT_SETTINGS = {

  annual:14,

  medical:14,

  hospitalization:60,

  compassionate:3,

  carryDays:0,

  carryHours:0,

  openingUsed:0,

  openingUsedHours:0

};


/* =========================================================
   SETTINGS
========================================================= */

function getPlSettings(){

  return Object.assign(
    {},
    PL_DEFAULT_SETTINGS,
    STATE.leaveSettings || {}
  );

}


/* =========================================================
   RECORDS
========================================================= */

function getPlRecords(){

  return (STATE.leaveRecords || [])
    .map(r => ({

      id:r.ID,

      type:r.Type,

      date:r.Date,

      unit:r.Unit || 'days',

      amount:Number(r.Amount) || 0,

      remark:r.Remark || ''

    }));

}


/* =========================================================
   FORMAT DURATION
========================================================= */

function plFormatDuration(days){

  const isNegative =
    days < -1e-9;


  let absDays =
    Math.abs(days);


  let wholeDays =
    Math.floor(
      absDays + 1e-9
    );


  let remainderHours =
    Math.round(
      (absDays - wholeDays)
      * PL_WORK_HOURS
      * 2
    ) / 2;


  if(
    remainderHours >=
    PL_WORK_HOURS - 1e-9
  ){

    wholeDays += 1;

    remainderHours = 0;

  }


  const wholeHours =
    Math.floor(
      remainderHours + 1e-9
    );


  const hasHalfHour =
    (remainderHours - wholeHours)
    >= 0.5 - 1e-9;


  const parts = [];


  if(wholeDays > 0){

    parts.push(
      wholeDays +
      (
        wholeDays === 1
          ? ' day'
          : ' days'
      )
    );

  }


  if(wholeHours > 0){

    parts.push(
      wholeHours +
      (
        wholeHours === 1
          ? ' hour'
          : ' hours'
      )
    );

  }


  if(hasHalfHour){

    parts.push('30 min');

  }


  if(parts.length === 0){

    parts.push('0 days');

  }


  return (
    isNegative ? '-' : ''
  ) +
  parts.join(' ');

}


/* =========================================================
   RECORD TO DAYS
========================================================= */

function plRecordToDays(r){

  if(r.unit === 'hours'){

    return Number(
      r.amount || 0
    ) / PL_WORK_HOURS;

  }


  return Number(
    r.amount || 0
  );

}


/* =========================================================
   RECORD LABEL
========================================================= */

function plRecordLabel(r){

  if(r.unit === 'hours'){

    const h =
      Number(r.amount || 0);


    const whole =
      Math.floor(h);


    const hasHalf =
      (h - whole)
      >= 0.5 - 1e-9;


    return (
      whole +
      (
        whole === 1
          ? ' hour'
          : ' hours'
      ) +
      (
        hasHalf
          ? ' 30 min'
          : ''
      )
    );

  }


  return plFormatDuration(
    Number(r.amount || 0)
  );

}


/* =========================================================
   ENTITLEMENT
========================================================= */

function plGetEntitlement(type){

  const s =
    getPlSettings();


  if(type === 'Annual Leave')
    return Number(s.annual) || 0;


  if(type === 'Medical Leave')
    return Number(s.medical) || 0;


  if(type === 'Hospitalization')
    return Number(s.hospitalization) || 0;


  if(type === 'Compassionate Leave')
    return Number(s.compassionate) || 0;


  return 0;

}


/* =========================================================
   CARRY FORWARD
========================================================= */

function plGetCarryForward(){

  const s =
    getPlSettings();


  return (
    Number(s.carryDays) || 0
  ) +
  (
    Number(s.carryHours) || 0
  ) / PL_WORK_HOURS;

}


/* =========================================================
   OPENING USED
========================================================= */

function plGetOpeningUsed(){

  const s =
    getPlSettings();


  return (
    Number(s.openingUsed) || 0
  ) +
  (
    Number(s.openingUsedHours) || 0
  ) / PL_WORK_HOURS;

}


/* =========================================================
   ANNUAL ACCRUAL
========================================================= */

function plAnnualAccrued(){

  const now =
    new Date();


  const usableMonths =
    Math.max(
      0,
      Math.min(
        12,
        now.getMonth()
      )
    );


  return (
    plGetEntitlement(
      'Annual Leave'
    ) / 12
  ) *
  usableMonths;

}


/* =========================================================
   USED
========================================================= */

function plGetUsed(type){

  return getPlRecords()

    .filter(
      r => r.type === type
    )

    .reduce(
      (sum,r) =>
        sum + plRecordToDays(r),
      0
    );

}


/* =========================================================
   BALANCE
========================================================= */

function plGetBalance(type){

  if(type === 'Annual Leave'){

    return (
      plGetCarryForward() +
      plAnnualAccrued() -
      plGetOpeningUsed() -
      plGetUsed(type)
    );

  }


  return (
    plGetEntitlement(type) -
    plGetUsed(type)
  );

}


/* =========================================================
   RENDER BALANCE
========================================================= */

function renderPersonalLeave(){

  const grid =
    document.getElementById(
      'plLeaveGrid'
    );


  if(!grid)
    return;


  grid.innerHTML =
    PL_TYPES
      .map(type => {

        const [
          accent,
          bg
        ] =
          getPlAccents()[type];


        const balance =
          plGetBalance(type);


        return `

          <button
            type="button"
            class="pl-card"
            style="
              --pl-accent:${accent};
              --pl-icon-bg:${bg};
            "
            onclick="
              plShowDetails('${type}')
            ">

            <div class="pl-icon">
              ${PL_ICONS[type]}
            </div>

            <div
              class="pl-balance
                ${balance < 0 ? 'negative' : ''}">

              ${plFormatDuration(balance)}

            </div>

            <div class="pl-available">
              ${t('available')}
            </div>

            <div class="pl-arrow">
              ↗
            </div>

          </button>

        `;

      })
      .join('');

/* =========================================================
   RENDER RECORDS
========================================================= */

function renderPlRecords(){

  const box =
    document.getElementById(
      'plRecords'
    );


  if(!box)
    return;


  const records =
    getPlRecords();


  if(records.length === 0){

    box.innerHTML = `

      <div
        class="empty"
        style="
          text-align:center;
          padding:14px 0;
        ">

        ${t('records_empty')}

      </div>

    `;

    return;

  }


  const sorted =
    records
      .slice()
      .sort(
        (a,b) =>
          String(b.date || '')
            .localeCompare(
              String(a.date || '')
            )
      );


  box.innerHTML =
    sorted
      .map(r => `

        <div class="pl-line">

          <div class="pl-line-left">

            <b>
              ${plTypeLabel(r.type)}
            </b>

            <div class="pl-line-muted">

              ${formatDate(r.date)}

              ${
                r.remark
                  ? ' · ' +
                    escapeHtml(r.remark)
                  : ''
              }

            </div>

          </div>


          <div class="pl-line-right">

            <b>
              ${plRecordLabel(r)}
            </b>

            <button
              class="pl-delete"
              onclick="
                plDeleteRecord(
                  '${String(r.id)
                    .replace(/'/g,"\\'")}'
                )
              "
              title="Delete record">
            </button>

          </div>

        </div>

      `)
      .join('');

}

async function plSaveSettings(){

  const settings = {

    annual:
      Number(
        document.getElementById(
          'plSetAnnual'
        ).value
      ) || 0,

    medical:
      Number(
        document.getElementById(
          'plSetMedical'
        ).value
      ) || 0,

    hospitalization:
      Number(
        document.getElementById(
          'plSetHosp'
        ).value
      ) || 0,

    compassionate:
      Number(
        document.getElementById(
          'plSetComp'
        ).value
      ) || 0,

    carryDays:
      Number(
        document.getElementById(
          'plSetCarryDays'
        ).value
      ) || 0,

    carryHours:
      Number(
        document.getElementById(
          'plSetCarryHours'
        ).value
      ) || 0,

    openingUsed:
      Number(
        document.getElementById(
          'plSetOpeningUsed'
        ).value
      ) || 0,

    openingUsedHours:
      Number(
        document.getElementById(
          'plSetOpeningUsedHours'
        ).value
      ) || 0

  };


  const saveBtn =
    document.querySelector(
      '.pl-settings-save'
    );


  if(saveBtn){

    saveBtn.disabled = true;

    saveBtn.textContent =
      t('btn_saving');

  }


  try{

    const result =
      await apiPost({

        action:
          'saveLeaveSettings',

        ...settings

      });


    if(
      result &&
      result.success === false
    ){

      throw new Error(
        result.error ||
        'Unable to save settings.'
      );

    }


    const overlay =
      document.getElementById(
        'plSettingsOverlay'
      );


    if(overlay)
      overlay.remove();


    showStatus(
      t('msg_settings_saved'),
      'success'
    );


    await loadData();

  }catch(err){

    console.error(err);

    showStatus(
      err.message ||
      t('msg_settings_save_error'),
      'error'
    );


    if(saveBtn){

      saveBtn.disabled = false;

      saveBtn.textContent =
        t('btn_save');

    }

  }

}


/* =========================================================
   HOURS
========================================================= */

function plPopulateHoursInput(){

  const sel =
    document.getElementById(
      'plHours'
    );


  if(!sel)
    return;


  if(sel.options.length > 0)
    return;


  const opts = [];


  for(
    let h = 0.5;
    h <= PL_WORK_HOURS;
    h += 0.5
  ){

    const whole =
      Math.floor(h);


    const hasHalf =
      (h - whole)
      >= 0.5 - 1e-9;


    opts.push(`

      <option value="${h}">

        ${whole}
        ${hasHalf ? ' hour 30 min' : ' hour' + (whole === 1 ? '' : 's')}

      </option>

    `);

  }


  sel.innerHTML =
    opts.join('');

}

async function addPlRecord(){

  const type =
    document.getElementById(
      'plType'
    ).value;


  const date =
    document.getElementById(
      'plDate'
    ).value;


  const unit =
    document.getElementById(
      'plUnit'
    ).value;


  const amount =
    unit === 'hours'
      ? Number(
          document.getElementById(
            'plHours'
          ).value
        )
      : Number(
          document.getElementById(
            'plDays'
          ).value
        );


  const remark =
    document.getElementById(
      'plRemark'
    ).value.trim();


  if(
    !date ||
    !amount ||
    amount <= 0
  ){

    alert(
      t('msg_enter_date_duration')
    );

    return;

  }


  const addBtn =
    document.querySelector(
      '.pl-add-btn'
    );


  if(addBtn){

    addBtn.disabled = true;

    addBtn.textContent =
      t('add_btn_saving');

  }


  try{

    const result =
      await apiPost({

        action:
          'addLeaveRecord',

        type,

        date,

        unit,

        amount,

        remark

      });


    if(
      result &&
      result.success === false
    ){

      throw new Error(
        result.error ||
        'Unable to add record.'
      );

    }


    document.getElementById(
      'plDate'
    ).value = '';


    document.getElementById(
      'plDays'
    ).value = '';


    document.getElementById(
      'plRemark'
    ).value = '';


    const form =
      document.getElementById(
        'plAddForm'
      );


    const btn =
      document.getElementById(
        'plAddToggle'
      );


    form.style.display =
      'none';


    btn.textContent =
      t('add_toggle_open');


    btn.classList.remove(
      'open'
    );


    showStatus(
      t('msg_record_added'),
      'success'
    );


    await loadData();

  }catch(err){

    console.error(err);

    showStatus(
      err.message ||
      t('msg_record_add_error'),
      'error'
    );

  }finally{

    if(addBtn){

      addBtn.disabled = false;

      addBtn.textContent =
        t('add_btn');

    }

  }

}

/* =========================================================
   API GET
========================================================= */

async function apiGet(){

  const res =
    await fetch(
      CONFIG.API_URL,
      {
        method:'GET',
        cache:'no-store'
      }
    );


  if(!res.ok){

    throw new Error(
      'API request failed: ' +
      res.status
    );

  }


  const data =
    await res.json();


  if(
    data &&
    data.success === false
  ){

    throw new Error(
      data.error ||
      'API returned an error.'
    );

  }


  return data;

}


/* =========================================================
   API POST
========================================================= */

async function apiPost(payload){

  const res =
    await fetch(
      CONFIG.API_URL,
      {

        method:'POST',

        headers:{
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify(payload)

      }
    );


  if(!res.ok){

    throw new Error(
      'API request failed: ' +
      res.status
    );

  }


  const data =
    await res.json();


  if(
    data &&
    data.success === false
  ){

    throw new Error(
      data.error ||
      'API returned an error.'
    );

  }


  return data;

}

    STATE = {

      leaveRecords:
        Array.isArray(
          data.leaveRecords
        )
          ? data.leaveRecords
          : [],

      leaveSettings:
        data.leaveSettings || null

    };


    renderPersonalLeave();


  }catch(err){

    console.error(
      'Failed to load leave data:',
      err
    );

          </small>

function plApplyTheme(){

    document.documentElement.setAttribute(

    );

  }else{

  renderPersonalLeave();

  const existing =
    document.getElementById('plSettingsOverlay');

  if(existing) existing.remove();

  plShowSettings();

}

function plSetTheme(theme){

  PL_THEME = theme;

  localStorage.setItem('plTheme', theme);

  plApplyTheme();

  renderPersonalLeave();

  const existing =
    document.getElementById('plSettingsOverlay');

  if(existing) existing.remove();

  plShowSettings();

}


/* =========================================================
   HEADER LIVE CLOCK
========================================================= */

function plUpdateHeaderClock(){

  const dateEl =
    document.getElementById('plHeaderDate');

  const timeEl =
    document.getElementById('plTime');

  if(!dateEl && !timeEl)
    return;

  const now = new Date();

  if(dateEl){
    dateEl.textContent =
      now.toLocaleDateString('en-MY', {
        weekday:'short',
        day:'2-digit',
        month:'short'
      });
  }

  if(timeEl){
    timeEl.textContent =
      now.toLocaleTimeString('en-MY', {
        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit',
        hour12:false
      });
  }

}

/* =========================================================
   DATE
========================================================= */

function formatDate(dateString){

  if(!dateString)
    return '—';


  const d =
    new Date(dateString);


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return dateString;

  }


  return d.toLocaleDateString(
    'en-MY',
    {

      day:'2-digit',

      month:'short',

      year:'numeric'

    }
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  type='success'
){

  const el =
    document.getElementById(
      'statusMessage'
    );


  if(!el)
    return;


  el.textContent =
    message;


  el.className =
    'status show ' +
    type;


  clearTimeout(
    showStatus.timer
  );


  showStatus.timer =
    setTimeout(
      () => {

        el.className =
          'status';

      },
      3000
    );

}



/* =========================================================
   PWA / INSTALL APP
========================================================= */

let plDeferredInstallPrompt = null;

function plIsStandalone(){

  return (
    (window.matchMedia &&
     window.matchMedia('(display-mode: standalone)').matches) ||
    window.navigator.standalone === true
  );

}

window.addEventListener('beforeinstallprompt', (event) => {

  event.preventDefault();

  plDeferredInstallPrompt = event;

  const btn =
    document.getElementById('plInstallBtn');

  if(btn){
    btn.style.display = 'flex';
  }

});

window.addEventListener('appinstalled', () => {

  plDeferredInstallPrompt = null;

  const btn =
    document.getElementById('plInstallBtn');

  if(btn){
    btn.style.display = 'none';
  }

  showStatus(
    t('msg_app_installed'),
    'success'
  );

});

async function installPersonalLeaveApp(){

  // Android / Chrome / Edge / supported browsers
  if(plDeferredInstallPrompt){

    try{

      plDeferredInstallPrompt.prompt();

      const choice =
        await plDeferredInstallPrompt.userChoice;

      if(choice.outcome === 'accepted'){

        showStatus(
          t('msg_installing'),
          'success'
        );

      }

    }catch(error){

      console.error(
        'Install prompt error:',
        error
      );

    }finally{

      plDeferredInstallPrompt = null;

    }

    return;

  }

  // iPhone / iPad
  const isIOS =
    /iphone|ipad|ipod/i.test(
      navigator.userAgent
    );

  if(isIOS){

    alert(
      t('ios_install_instructions')
    );

    return;

  }

  // Browser fallback
  alert(
    t('browser_install_fallback')
  );

}

function plUpdateInstallButton(){

  const btn =
    document.getElementById('plInstallBtn');

  if(!btn)
    return;

  if(plIsStandalone()){

    btn.style.display = 'none';

  }else{

    btn.style.display = 'flex';

  }

}

/* Register service worker. Required for reliable PWA installation. */
if('serviceWorker' in navigator){

  window.addEventListener('load', () => {

    navigator.serviceWorker
      .register('./sw.js')
      .then(registration => {

        console.log(
          'FND Leave Service Worker registered:',
          registration.scope
        );

      })
      .catch(error => {

        console.error(
          'FND Leave Service Worker registration failed:',
          error
        );

      });

  });

}

/* =========================================================
   START
========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  () => {

    plApplyTheme();

    plApplyLanguage();

    plPopulateHoursInput();

    plUpdateInstallButton();

    plUpdateHeaderClock();

    setInterval(plUpdateHeaderClock, 1000);

    loadData();

  }
);
